[project]
name = "lms-polinema-mcp"
version = "0.1.1"
description = "MCP server for LMS Polinema (SIAKAD + SPADA + Moodle)"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Hafidz Rafi Rabbani", email = "mohammadhafidzrafirabbani99@gmail.com" }
]
requires-python = ">=3.11"
keywords = ["mcp", "lms", "moodle", "polinema", "campus"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "beautifulsoup4>=4.12.0",
    "httpx>=0.28.0",
    "lxml>=5.0.0",
    "mcp>=2.2.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
]

[project.urls]
Repository = "https://github.com/hafidzrafi/lms-polinema-mcp"
Issues = "https://github.com/hafidzrafi/lms-polinema-mcp/issues"
Changelog = "https://github.com/hafidzrafi/lms-polinema-mcp/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
lms-polinema-mcp = "lms_polinema_mcp.server:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
