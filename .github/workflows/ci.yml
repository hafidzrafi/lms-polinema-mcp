name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint with ruff
        run: uv run ruff check src/ auth.py

      - name: Format check with ruff
        run: uv run ruff format --check src/ auth.py

      - name: Verify imports compile cleanly
        run: |
          uv run python -c "
          import lms_polinema_mcp.server as s
          import lms_polinema_mcp.models as m
          import lms_polinema_mcp.services as sv
          import lms_polinema_mcp.auth.credentials as c
          import lms_polinema_mcp.auth.session as ss
          import lms_polinema_mcp.auth.refresh as r
          print('All modules imported successfully.')
          print('Registered tools:', [t.name for t in s.mcp._tool_manager.list_tools()])
          "
